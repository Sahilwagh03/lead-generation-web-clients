
services:
  postgres:
    image: postgres:15
    container_name: leads_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: leads_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
